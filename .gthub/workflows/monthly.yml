name: Monthly issuance bundle
# On the 1st of each month at 02:11 UTC (after the daily run has filed the last day):
# downloads the previous month's day files from its release, checks each against
# index.json, and attaches one compressed file with the whole month to the same release.
# Run by hand with a month (YYYY-MM) to bundle any month already archived.
on:
  schedule:
    - cron: '11 2 1 * *'
  workflow_dispatch:
    inputs:
      month:
        description: 'Month to bundle, YYYY-MM (empty: the previous month)'
        required: false
        default: ''
permissions:
  contents: write
concurrency:
  group: issuance
  cancel-in-progress: false
jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Download the month's day files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          M="${{ inputs.month }}"; [ -n "$M" ] || M=$(date -u -d "$(date -u +%Y-%m-01) -1 day" +%Y-%m)
          echo "M=$M" >> "$GITHUB_ENV"; mkdir -p work
          gh release download "issuance-$M" -p "$M-??.json" -D work
          ls work | wc -l
      - name: Bundle and check
        run: node tools/bundle.mjs "$M"
      - name: Attach the bundle and commit the index
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "issuance-$M" "work/issuance-$M.json.gz" --clobber
          git config user.name "issuance-archive"
          git config user.email "actions@users.noreply.github.com"
          git add index.json
          git diff --cached --quiet || { git commit -m "Monthly bundle: $M"; git pull --rebase; git push; }
