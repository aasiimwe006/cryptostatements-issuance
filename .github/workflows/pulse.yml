name: Data Wire pulse
# r384 · AP104 stage 1 (plan approved by the founder 28 Nov 2026). Every 30 minutes, around the clock: tools/pulse.mjs re-reads
# stablecoin flows and supply, Tether's per-chain file and EDGAR's filing lists for the followed filers, and writes one line
# per change to wire.json, which GitHub Pages serves to the Data Wire page. It commits only when there is something new.
# Shares the "issuance" group with the daily workflow, so the two never run at once. GitHub can start a scheduled run
# late and, under heavy load, drop one; the Data Wire shows the time of the last good read.
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: issuance
  cancel-in-progress: false
jobs:
  pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Read what changed since the last pulse
        env:
          ISSUANCE_RPCS: ${{ secrets.ISSUANCE_RPCS }}
        run: node tools/pulse.mjs
      - name: Commit wire.json if it changed
        run: |
          git config user.name "issuance-archive"
          git config user.email "actions@users.noreply.github.com"
          if [ -f wire.json ]; then git add wire.json; fi
          if git diff --cached --quiet; then echo "Wire unchanged"; exit 0; fi
          git commit -m "Wire: $(node -e "const w=require('./wire.json');console.log(w.updated+' · '+w.events.length+' lines')")"
          git pull --rebase
          git push
