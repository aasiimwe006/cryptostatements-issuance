name: Daily issuance archive
# Every day at 00:23 UTC: reads the previous UTC day's mint, burn, freeze, wipe and pause
# events from the USDC, USDT, PAXG, EURC and PYUSD contracts on Ethereum, uploads the day file
# to that month's release (issuance-YYYY-MM), reads each token's supply into supply.json (r147),
# reads bStocks supply on BNB Chain into bstocks.json (r185), bStocks daily closes from Binance Spot into bstocks_prices.json (r196) and re-reads the regulators' registers behind the Exchange Register into registers.json (r219), writes stablecoin supply history and the daily market snapshot into market.json (r276), appends market-linked signals to signals.json and the CFTC's weekly CME positioning to cot.json and US Treasury yields to macro.json (r281), spot ETF holdings from the issuers' own files to etf.json (r282), the daily Market Structure labels to structure.json (r289), and commits index.json, supply.json, bstocks.json, bstocks_prices.json, registers.json, market.json, signals.json, cot.json, macro.json, etf.json and structure.json, which GitHub Pages serves to the CRYPTO STATEMENTS
# Reserve Monitor. No Netlify deploy is involved. Run by hand to
# backfill (date YYYY-MM-DD or DD-MM-YYYY, up to 31 days).
on:
  schedule:
    - cron: '23 0 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'First UTC day, YYYY-MM-DD or DD-MM-YYYY (empty: yesterday)'
        required: false
        default: ''
      days:
        description: 'Number of days (1 to 31)'
        required: false
        default: '1'
permissions:
  contents: write
concurrency:
  group: issuance
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Read the contract events
        # The hand-run inputs reach the script as environment values, never pasted into the shell line (2026-11-06).
        env:
          ISSUANCE_RPCS: ${{ secrets.ISSUANCE_RPCS }}
          IN_DATE: ${{ inputs.date }}
          IN_DAYS: ${{ inputs.days || '1' }}
        run: node tools/issuance.mjs "$IN_DATE" "$IN_DAYS"
      - name: Read today's supply (r147)
        if: always()
        env:
          ISSUANCE_RPCS: ${{ secrets.ISSUANCE_RPCS }}
        run: node tools/supply.mjs
      - name: bStocks — on-chain supply, Friday snapshot, reconciliation (r185)
        if: always()
        env:
          BSC_RPCS: ${{ secrets.BSC_RPCS }}
        run: node tools/bstocks.mjs
      - name: bStocks — daily closes from Binance Spot (r196, AP40)
        if: always()
        run: node tools/bstocks_prices.mjs
      - name: Registers — nightly re-read for the Exchange Register (r219)
        if: always()
        run: node tools/registers.mjs
      - name: Market history and the daily snapshot (r276, AP75)
        if: always()
        run: node tools/market.mjs
      - name: Market-linked signals for the alert ledger (r281)
        if: always()
        run: node tools/signals.mjs
      - name: CFTC Commitments of Traders, CME bitcoin and ether (r281)
        if: always()
        run: node tools/cot.mjs
      - name: US Treasury yields for macro records (r281)
        if: always()
        run: node tools/macro.mjs
      - name: Spot ETF holdings from the issuers' own files (r282)
        if: always()
        run: node tools/etf.mjs
      - name: Dollar liquidity, the dollar and policy rates (r294)
        if: always()
        run: node tools/liquidity.mjs
      - name: Bitcoin issued, from the chain's height (r294)
        if: always()
        run: node tools/chain.mjs
      - name: Perpetual open interest by venue, OKX and Binance (r301)
        if: always()
        run: node tools/leverage.mjs
      - name: Market Structure labels, one row per day (r289, struct-v2 from r294)
        if: always()
        run: node tools/structure.mjs
      - name: Upload each day to its month's release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          for f in work/????-??-??.json; do
            d=$(basename "$f" .json); tag="issuance-${d:0:7}"
            gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "Issuance archive ${d:0:7}" \
              --notes "Mint, burn, freeze, wipe and pause events from the USDC, USDT, PAXG, EURC and PYUSD contracts on Ethereum, one file per UTC day, read from the chain by the daily workflow. Totals in index.json. What each contract recorded, never why."
            gh release upload "$tag" "$f" --clobber
            echo "uploaded $d to $tag"
          done
      - name: Commit the index
        if: always()
        run: |
          git config user.name "issuance-archive"
          git config user.email "actions@users.noreply.github.com"
          git add index.json
          if [ -f supply.json ]; then git add supply.json; fi
          if [ -f bstocks.json ]; then git add bstocks.json; fi
          if [ -f bstocks_prices.json ]; then git add bstocks_prices.json; fi
          if [ -f registers.json ]; then git add registers.json; fi
          if [ -f market.json ]; then git add market.json; fi
          if [ -f signals.json ]; then git add signals.json; fi
          if [ -f cot.json ]; then git add cot.json; fi
          if [ -f macro.json ]; then git add macro.json; fi
          if [ -f etf.json ]; then git add etf.json; fi
          if [ -f liquidity.json ]; then git add liquidity.json; fi
          if [ -f chain.json ]; then git add chain.json; fi
          if [ -f leverage.json ]; then git add leverage.json; fi
          if [ -f structure.json ]; then git add structure.json; fi
          if git diff --cached --quiet; then echo "Index unchanged"; exit 0; fi
          git commit -m "Index: $(node -e "const i=require('./index.json');console.log(i.days[i.days.length-1].date+' · '+i.days.length+' days')")"
          git pull --rebase
          git push
